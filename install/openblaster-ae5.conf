;
; PipeWire/PulseAudio card profile set for the Sound BlasterX AE-5 / AE-5 Plus (ca0132).
;
; The stock 5.1 profile sends the channels in the classic order FL FR RL RR FC LFE. The kernel driver (and the
; card's DSP, which does the headphone virtualization) takes them in the HDA order FL FR FC LFE RL RR (see
; `amixer cget name='Playback Channel Map'`), so with the stock profile the centre came out as rear left, the
; rear right as the subwoofer, and so on. This set says the driver's order, and opens the card directly
; (plughw) so ALSA's own "surround51" remapping stays out of the way.
;
; Used by the card through the ACP_PROFILE_SET property that 70-openblaster.rules sets.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = analog-output analog-output-lineout analog-output-speaker analog-output-headphones analog-output-headphones-2
paths-input = analog-input-front-mic analog-input-rear-mic analog-input-internal-mic analog-input-dock-mic analog-input analog-input-mic analog-input-linein analog-input-aux analog-input-video analog-input-tvtuner analog-input-fm analog-input-mic-line analog-input-headphone-mic analog-input-headset-mic
priority = 15

[Mapping analog-surround-51]
device-strings = plughw:%f
channel-map = front-left,front-right,front-center,lfe,rear-left,rear-right
paths-input = analog-input analog-input-linein analog-input-mic
paths-output = analog-output analog-output-lineout analog-output-speaker analog-output-headphones analog-output-headphones-2
priority = 13

[Mapping iec958-stereo]
device-strings = iec958:%f
channel-map = left,right
paths-input = iec958-stereo-input
paths-output = iec958-stereo-output
priority = 5
